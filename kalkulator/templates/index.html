<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="calculator">
        <h1>Kalkulator</h1>
        <form method="POST">
            <label for="num1">Angka pertama</label>
            <input id="num1" type="number" step="any" name="num1" required>

            <label for="operation">Operasi</label>
            <select id="operation" name="operation">
                <option value="add">+</option>
                <option value="subtract">-</option>
                <option value="multiply">x</option>
                <option value="divide">/</option>
            </select>

            <label for="num2">Angka kedua</label>
            <input id="num2" type="number" step="any" name="num2" required>

            <button type="submit">Hitung</button>
        </form>

        {% if result is not none %}
            <output class="result" aria-live="polite">Hasil: {{ result }}</output>
        {% endif %}
    </main>
</body>
</html>
